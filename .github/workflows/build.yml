  name: Build

  on:
    push:
      branches: ["main", "dev"]
    pull_request:
      branches: [ "main", "dev" ]


  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 17

        - uses: gradle/actions/setup-gradle@v4

        - name: Make gradlew executable
          run: chmod +x ./gradlew

        - name: Build
          run: ./gradlew build

